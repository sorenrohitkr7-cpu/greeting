<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Msg</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header::before {
            content: "";
            background-image: url(https://images.pexels.com/photos/38809718/pexels-photo-38809718.jpeg);
            background-size: cover;
            background-position: center;
            background-repeat: repeat;
            background-attachment: fixed;
            position: fixed;
            height: 100%;
            width: 100%;
            top: 0%;
            left: 0%;
            right: 0%;
            bottom: 0%;
            z-index: -1;
            opacity: 0.6;
        }

        .navi {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            position: fixed;
        }

        .logo img {
            /* display: inline-block; */
            /* position: absolute; */
            border-radius: 5px;
        }

        .mid {
            /* display: flex; */
            /* margin: 3px 600px; */
            /* border: 2px solid red; */
            /* padding: 5px; */
            font-weight: 400;
            /* align-items: center; */
            justify-content: center;
            font-size: 25px;
            /* border-style: none; */
            text-decoration: underline;
            /* flex: 1;  */
        }

        .container, .container2 {
            display: flex;
            flex-wrap: wrap;
            /* height: 400px; */
            /* width: auto; */
            /* border: 2px solid red; */
            align-items: center;
            justify-content: center;
            padding-left: 20px;
            gap: 20px;
            text-align: center;
        }
        .container{
            position:fixed;
            
        }

        .container img, .container2 img {
            border-radius: 100px;
        }

        .box1,
        .box2,
        .box3 {
            flex: 1 1 300px;
            color: rgb(244, 247, 246);
            /* font-weight: bold ; */
            font-family: Georgia, 'Times New Roman', Times, serif;
            text-shadow: 2px 1px black;

            figcaption {
                text-align: center;
                margin: 5px;
            }
        }

        .memory, .dream {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .memory img {
            max-width: 100%;
            height: auto;
            border-radius: 100px;
        }

        h2 {
            text-align: center;
            text-decoration: underline;
            margin-top: 20px;
        }
        h3{
            margin: 3px 10px;
            font-family:cursive;
        }

        /* Media query for phones */
        @media(max-width:600px) {
            .mid {
                width: auto;
            }

            .container {
                flex-direction: column;
            }
            .container2{
                flex-direction: column;
            }
        }

        .dream img {
            max-width: 100%;
            height: auto;
            border-radius: 100px;
        }
    </style>
</head>

<body>
    <header class="header">
        <nav class="navi">
            <div class="logo"><img src="logo.jpg" alt="logo" width="50" height="50"></div>
            <!-- <div class="mid"><img src="Travel.png" alt="" width="50"></div> -->
        </nav>
    </header>
    <div class="container">
        <div class="box1">Happy Birth-Day.<br>"May this new year of your life bring clarity to your goals, courage to
            pursue
            your passion, and unwavering confidence in your abilities".</div>
        <div class="box2">
            <figure>
                <img src="img.jpg" alt="img" width="300" height="200">
                <figcaption>
                    Peace of my life... Putri.
                </figcaption>
            </figure>
        </div>
        <div class="box3">"You are my favorite thought, my favorite notification,and my favorite place to be."</div>
    </div>
    <h2>Memories</h2><br>
    <div class="memory">
        <div><img src="chat.png" alt="chat" width="400" height="400"></div>
        <div><img src="meet.png" alt="meet" width="400" height="400"></div>
        <div><img src="momos.png" alt="momos" width="400" height="400"></div>
        <div><img src="city park.png" alt="city-park" width="300" height="450"></div>
        <div><img src="Park2.jpg" alt="park2" width="500"></div>
        <div><img src="night.png" alt="night" width="500"></div>
        <div><img src="station.png" alt="sit" width="500"></div>
        <div><img src="laugh.png" alt="laugh" width="500"></div>
    </div>
    <h2>Dreams</h2>
    <div class="container2">
        <div class="dream">
            <div><img src="garden.png" alt="garden" width="500"></div>
            <div><img src="movies.png" alt="movies" width="500"> </div>
            <div><img src="train.png" alt="train" width="500"></div>
            <div><img src="track.png" alt="track" width="500"></div>
        </div>
    </div>
<h3>To be continued........</h3>
</body>

</html>
